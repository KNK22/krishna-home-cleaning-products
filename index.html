<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Krishna Home Cleaning Products</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2e7d32" />

  <link rel="stylesheet" href="style.css" />

  <style>
    /* =====================================================
       FESTIVE OFFER BLOCK – HOMEPAGE
       (BIG IMAGE + CENTER BUTTON + DOTTED BORDER)
    ===================================================== */

    .festive-home-wrapper {
      padding: 20px;
    }

    /* DOTTED CONTAINER */
    .festive-home-box {
      border: 2px solid #050709; /* soft light border */
      border-radius: 26px;
      padding: 20px;
      background: #020617;
    }


    /* FESTIVE IMAGE */
    .festive-home-image {
      width: 100%;
      height: 180px;                 /* CHANGE HEIGHT IF NEEDED */
      border-radius: 18px;
      background-size: cover;
      background-position: center;
      background-color: #020617;

      display: flex;
      align-items: center;
      justify-content: center;

      font-weight: 600;
      color: #666;
      margin-bottom: 22px;
    }

    /* CENTER BUTTON */
    .festive-home-btn {
      display: block;
      width: fit-content;
      margin: 0 auto;

      background: #22c55e;
      color: #fff;
      padding: 14px 30px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
    }

    .festive-home-btn:hover {
      background: #16a34a;
    }

    /* ===============================
       DARK MODE (SYSTEM BASED)
       =============================== */


    body {
      background: #0f172a;
      color: #e5e7eb;
    }

    /* Header */
    .header {
      background: #020617;
    }

    .header-title {
      color: #f8fafc;
    }

    .trust-strip {
      color: #22c55e; /* keep green */
    }

    .header-divider {
      border-color: #1e293b;
    }

    /* Cards */
    .card {
      background: #020617;
      border-color: #1e293b;
    }

    .card h3 {
      color: #f8fafc;
    }

    .card p {
      color: #cbd5e1;
    }

    /* Buttons */
    .header-pill,
    .festive-home-btn {
      background: #16a34a;
      color: #000000;
    }

    /* Festive box */
    .festive-home-box {
      background: #020617;
      border-color: #1e293b;
    }

  </style>
</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">
  <div class="header-title">
    Krishna Home Cleaning Products
  </div>

  <div class="trust-strip">
    ✔ Hygienic & Safe &nbsp; • &nbsp;
    ✔ Trusted Quality &nbsp; • &nbsp;
    ✔ Affordable Prices
  </div>
</div>

<hr class="header-divider" />

<!-- =====================================================
     CART BUTTON
===================================================== -->

<div class="cart-row">
  <a href="cart.html" class="header-pill cart-btn" id="cartBtn">
    🛒 Cart (0)
  </a>
</div>

<!-- ===============================

 STRIP
     =============================== -->

<div class="install-box v7" id="installBox">
  <div class="left">
    <div class="icon logo">
      <img src="icons/icon-192.png" alt="Krishna App">
    </div>
    <div class="text">
      Krishna Mart App
      <small>Install for best experience</small>
    </div>
  </div>

  <a href="download.html" class="btn">Install</a>
</div>


<!-- =====================================================
     ✅ OFFERS ENABLE/DISABLE OPTION (CHANGE HERE)

     Set false = show "No offers available" design
===================================================== -->
<script>

</script>

<!-- =====================================================

===================================================== -->

<div id="offersSection"></div>

    } else {
      /* ❌ DISABLED: SHOW NO OFFERS DESIGN (YOUR FINAL DESIGN) */
      el.innerHTML = `
        <div class="festive-home-wrapper">
          <div class="festive-home-box" style="
            border-radius: 24px;
            padding: 14px 14px 16px;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 0 0 1px rgba(255,255,255,0.05);
          ">

            <!-- OFFLINE PILL LEFT -->
            <div style="
              display:inline-flex;
              align-items:center;
              gap:10px;
              padding:10px 14px;
              border-radius:999px;
              border:1px solid rgba(255,255,255,0.12);
              font-size:13px;
              font-weight:800;
              color:#e2e8f0;
              background:rgba(255,255,255,0.03);
              white-space:nowrap;
            ">
              <span style="
                width:10px;
                height:10px;
                border-radius:50%;
                background:#64748b;
                display:inline-block;
              "></span>
              OFFLINE
            </div>

            <!-- EMOJI CENTER -->
            <div style="
              margin:12px auto 8px;

              height:38px;
              border-radius:18px;
              background:rgba(255,255,255,0.04);
              display:flex;

              font-size:19px;

            <!-- TEXT CENTER -->
            <div style="
              font-size:18px;
              font-weight:900;
              color:#ffffff;
              margin:0 0 6px;
              text-align:center;
            ">
              No offers available currently
            </div>

            <div style="
              font-size:12.5px;
              color:#cbd5f5;
              line-height:1.5;
              margin:0 0 12px;
              text-align:center;
            ">
              Check back later for new deals and festive discounts.
            </div>

            <!-- STAY TUNED (NOT CLICKABLE) -->
            <div style="display:flex; justify-content:center;">
              <div style="
                display:inline-flex;
                align-items:center;
                justify-content:center;
                padding:9px 18px;
                border-radius:999px;
                border:1px solid rgba(34,197,94,0.6);
                color:#22c55e;
                font-weight:900;
                user-select:none;
                pointer-events:none;
                cursor:default;
              ">
                Stay tuned
              </div>
            </div>

          </div>
        </div>
      `;
    }
  })();
</script>



<!-- =====================================================
     NORMAL PRODUCTS GRID (DO NOT TOUCH)
===================================================== -->

<div class="grid" id="grid"></div>

<!-- =====================================================
     DATA
===================================================== -->

<script src="data.js"></script>

<script>
  /* ================= CART COUNT ================= */
  function updateCartCount() {
    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    let count = 0;
    cart.forEach(i => count += Number(i.qty) || 0);
    document.getElementById("cartBtn").innerText =
      "🛒 Cart (" + count + ")";
  }

  document.addEventListener("DOMContentLoaded", updateCartCount);
  window.addEventListener("focus", updateCartCount);

  /* ================= RENDER PRODUCTS ================= */

  const grid = document.getElementById("grid");

  Object.values(PRODUCTS).forEach(p => {
    const card = document.createElement("div");
    card.className = "card";

    const basePrice = Object.values(p.variants)[0].price;

    card.innerHTML = `
      <div class="img-box"
           style="background-image:url('./images/${p.imageFolder}/cover.jpg')">
      </div>
      <h3>${p.name}</h3>
      <p>From ₹${basePrice}</p>
    `;

    card.onclick = () => {
      location.href = "product.html?id=" + p.id;
    };

    grid.appendChild(card);
  });
</script>

<footer style="
  text-align:center;
  padding:16px 12px;
  font-size:25px;
  color:#555;
  border-top:1px solid #eee;
  margin-top:40px;
">
  REPACKED &amp; MARKETED BY KRISHNA
</footer>

<script>
  (function () {
    const installBox = document.getElementById("installBox");

    function isPWAInstalled() {
      return (
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true
      );
    }

    // Hide install strip if app is already installed
    if (isPWAInstalled() && installBox) {
      installBox.style.display = "none";
    }

    // Extra safety: once installed, hide it
    window.addEventListener("appinstalled", () => {
      if (installBox) installBox.style.display = "none";
    });
  })();
</script>

</body>
</html>
